services:
  backend:
    build:
      context: ./backend
    container_name: equitymind-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./streamlit
    container_name: equitymind-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
      